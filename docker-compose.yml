services:
  nmos-crosspoint:
    build:
      context: ./
    # Built locally from this folder (docker compose up -d --build). A name
    # without a registry prefix, so no pull can swap in an image from
    # somewhere else.
    image: nmos-crosspoint_v3:local

    container_name: nmos-crosspoint_v3
    hostname: nmos-crosspoint_v3
    domainname: local

    network_mode: host

    volumes:
      - ./server/config:/nmos-crosspoint/server/config
      - ./server/state:/nmos-crosspoint/server/state

    restart: unless-stopped